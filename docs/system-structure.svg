<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <rect width="1600" height="980" fill="#f7f8fb"/>
  <style>
    .box { fill: #ffffff; stroke: #24324a; stroke-width: 2; rx: 10; ry: 10; }
    .group { fill: #eaf0ff; stroke: #3254a8; stroke-width: 2; rx: 12; ry: 12; }
    .title { font: 700 24px Arial, sans-serif; fill: #182235; }
    .label { font: 600 18px Arial, sans-serif; fill: #182235; }
    .small { font: 15px Arial, sans-serif; fill: #2b3445; }
    .line { stroke: #50627d; stroke-width: 2; }
  </style>

  <rect class="group" x="520" y="20" width="560" height="80"/>
  <text class="title" x="800" y="70" text-anchor="middle">SMT 工厂集成管理系统</text>

  <line class="line" x1="800" y1="100" x2="800" y2="135"/>
  <line class="line" x1="220" y1="135" x2="1380" y2="135"/>

  <rect class="group" x="80" y="160" width="280" height="70"/>
  <text class="label" x="220" y="203" text-anchor="middle">应用层</text>

  <rect class="group" x="460" y="160" width="280" height="70"/>
  <text class="label" x="600" y="203" text-anchor="middle">服务层</text>

  <rect class="group" x="840" y="160" width="280" height="70"/>
