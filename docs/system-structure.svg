  <text class="small" x="800" y="465" text-anchor="middle">ERP → PMC → WMS → MES → Quality → Traceability → Reports → Admin</text>
  <text class="small" x="800" y="492" text-anchor="middle">客户PO → 工单 → 收料 → IQC → 入库 → 备料 → 发料 → 飞达绑定 → 生产 → 检验 → 维修 → 追溯</text>

