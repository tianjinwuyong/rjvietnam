# ------------------------------------------------------------------
# WMS 仓库管理系统 - Docker Compose 编排
#
#   启动：  docker compose up -d --build
#   停止：  docker compose down
#   看日志：docker compose logs -f wms
#
# 数据库只在内部网络可达，不映射到宿主机（更安全）。
# 如需用图形工具连库，把 db 下的 expose 换成
#   ports: ["127.0.0.1:5433:5432"]
# ------------------------------------------------------------------

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-factory}
      # 统一 UTF-8 + C locale，避免不同发行版排序规则差异导致索引行为不一致
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-factory}"]
      interval: 5s
      timeout: 5s
      retries: 30
    expose:
      - "5432"

  wms:
    build:
      context: .
      dockerfile: Dockerfile
    image: wms:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "3000"
      HTTPS_PORT: "3443"
      SSL_PFX_PASSPHRASE: ${SSL_PFX_PASSPHRASE:-wms2024}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-factory}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      LOG_DIR: logs
      LOG_REQUEST_BODY: "false"
      LOG_RESPONSE_BODY: "false"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${HTTP_PORT:-3000}:3000"
      - "${HTTPS_PORT:-3443}:3443"
    volumes:
      # 证书放宿主机，换证书不用重建镜像
      - ./ssl:/app/ssl:ro
      - ./logs:/app/logs

volumes:
  dbdata:
