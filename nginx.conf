server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Static assets — long cache for hashed files
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    # NOTE: the API also owns app-level paths outside /api (e.g. /wms/*,
    # /hr/*, /mes/*, /dashboard/summary) -- the SPA calls them without the
    # /api prefix. Those must be proxied too, otherwise the SPA fallback
    # answers them with index.html and the client sees HTML where it expects
    # JSON. The explicit proxy locations below are matched before this
    # fallback (nginx prefers the longest prefix match), so only genuine SPA
    # routes reach try_files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    # NOTE: with variables in proxy_pass, nginx ignores location-based URI
    # rewriting — a URI given here REPLACES the whole request URI. So the
    # URI part must be omitted: /api/foo is forwarded as /api/foo unchanged.
    location /api/ {
        set $api_host smt-api;
        set $api_port 8080;
        proxy_pass http://$api_host:$api_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # App-level API prefixes (no /api segment). Same proxy rules as /api/.
    # Kept as an explicit list so the SPA fallback still serves index.html for
    # real client-side routes (/?view=..., /assets/..., the html entry points).
    location ~ ^/(wms|hr|mes|pmc|qms|boms|erp|ai|admin|dashboard|equipment|equipment-supplier-comms|equipment-suppliers|factory-sim|finance|maintenance|managers|parts-pricing|parts-supplier-comms|parts-suppliers|pda|procurement|public|quality|reports|rjvn-inventory|rjvn-receipt|rjvn-wms|rjvn-iqc|rjvn-picking|rjvn-doc|spare-parts|supplier-quotes|traceability|bom-import-change-requests)(/|$) {
        set $api_host smt-api;
        set $api_port 8080;
        proxy_pass http://$api_host:$api_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Supplier portal API hosted on the public portal server.
    location /supplier-api/ {
        proxy_pass http://1.13.164.183:8084/supplier-api/;
        proxy_http_version 1.1;
        proxy_set_header Host 1.13.164.183;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check — proxy to the API so the SPA heartbeat sees the real
    # { ok, status:"ready" } JSON. A static 'ok' here would keep the lamp green
    # even when the API is down. No URI part in proxy_pass (variable rule above).
    location /health {
        set $api_host smt-api;
        set $api_port 8080;
        proxy_pass http://$api_host:$api_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
}