  /mes/product-gate/evaluate:
    post:
      tags: [MES]
      summary: Resolve a Product Identifier and return the authoritative station-entry decision
      description: >
        Station-Agent command interface. The idempotency key makes retries return the
        original decision. A Product may be created only by a released Work Order's
        configured first station. The caller must identify the operator, Agent, and host IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, stationCode, operatorId, agentId, hostIp, occurredAt, idempotencyKey]
              properties:
                identifier: { type: string }
                identifierType: { type: string, enum: [PCBA_SN, SHELL_SN, OTHER] }
                stationCode: { type: string }
                workOrderCode: { type: string }
                operatorId: { type: string }
                agentId: { type: string }
                hostIp: { type: string }
                occurredAt: { type: string, format: date-time }
                idempotencyKey: { type: string }
      responses:
        "200":
          description: Product Gate allowed the station or replayed an existing decision
        "400":
          description: Invalid station fact
        "409":
          description: HOLD, REJECT, REPAIR_ROUTE, or COMPLETED decision
        "500":
          description: Product Gate failed without creating a station permission

  /mes/spi/upload:
    post:
      tags: [MES]
      summary: Receive LeiChen SPI/AOI standard configurator V2.7 inspection JSON
      description: Equipment-facing endpoint on the factory LAN. Persists pcb_sn before returning code 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pcb_sn]
              properties:
                device_name: { type: string }
                pcb_sn: { type: string }
                pcb_test_time: { type: string }
                pcb_project_name: { type: string }
                pcb_robot_result: { type: string }
                pcb_user_result: { type: string }
                pcb_final_result: { type: string }
                board_data:
                  type: array
                  items:
                    type: object
                    properties:
                      board_sn: { type: string }
                      board_no: { type: string }
                      board_robot_result: { type: string }
                      board_user_result: { type: string }
                      board_final_result: { type: string }
      responses:
        "200":
          description: Configurator-compatible durable acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, const: "200" }
                  message: { type: string }
        "400":
          description: Missing pcb_sn
