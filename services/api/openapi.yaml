openapi: 3.1.0
info:
  title: Vietnam Ruijing SMT Factory API
  version: 0.2.0
  description: >
    Unified API contract for shared auth/session access, i18n bootstrap, ERP,
    PMC, WMS, MES, Quality, Traceability, Reports, Dashboard, and Admin.
servers:
  - url: /api
tags:
  - name: Auth
  - name: Meta
  - name: Dashboard
  - name: ERP
  - name: PMC
  - name: WMS
  - name: MES
  - name: Quality
  - name: Traceability
  - name: Reports
  - name: Admin
  - name: HR
  - name: Service
  - name: Maintenance
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session-token
  parameters:
    LocaleParam:
      name: locale
      in: query
      schema:
        type: string
        enum: [zh-CN, en-US, vi-VN]
    QParam:
      name: q
      in: query
      schema:
        type: string
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CursorParam:
      name: cursor
      in: query
      schema:
        type: string
    SortParam:
      name: sort
      in: query
      schema:
        type: string
    FromDateParam:
      name: fromDate
      in: query
      schema:
        type: string
        format: date-time
    ToDateParam:
      name: toDate
      in: query
      schema:
        type: string
        format: date-time
    IncludeParam:
      name: include
      in: query
      schema:
        type: string
    FieldsParam:
      name: fields
      in: query
      schema:
        type: string
    SessionIdParam:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    TraceKeyParam:
      name: traceKey
      in: path
      required: true
      schema:
        type: string
    CodeParam:
      name: code
      in: path
      required: true
      schema:
        type: string
    LineCodeParam:
      name: lineCode
      in: path
      required: true
      schema:
        type: string
    StationCodeParam:
      name: code
      in: path
      required: true
      schema:
        type: string
    WorkOrderCodePathParam:
      name: workOrderCode
      in: path
      required: true
      schema:
        type: string
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    LocalePathParam:
      name: locale
      in: path
      required: true
      schema:
        type: string
        enum: [zh-CN, en-US, vi-VN]
    ReportKeyParam:
      name: reportKey
      in: path
      required: true
      schema:
        type: string
    RoleKeyParam:
      name: roleKey
      in: path
      required: true
      schema:
        type: string
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
  schemas:
    EnvelopeMeta:
      type: object
      properties:
        requestId:
          type: string
        serverTime:
          type: string
          format: date-time
        locale:
          type: string
          enum: [zh-CN, en-US, vi-VN]
        warnings:
          type: array
          items:
            type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        meta:
          $ref: "#/components/schemas/EnvelopeMeta"
    SuccessEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          $ref: "#/components/schemas/EnvelopeMeta"
    ListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
            nextCursor:
              oneOf:
                - type: string
                - type: "null"
        meta:
          $ref: "#/components/schemas/EnvelopeMeta"
    MutationEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [item]
          properties:
            item:
              type: object
              additionalProperties: true
            auditEventId:
              type: string
        meta:
          $ref: "#/components/schemas/EnvelopeMeta"
    CommandEnvelope:
      type: object
      required: [action, payload, context]
      properties:
        action:
          type: string
        payload:
          type: object
          additionalProperties: true
        context:
          type: object
          required: [operator]
          properties:
            operator:
              type: string
            workstationId:
              type: string
            deviceLabel:
              type: string
            locale:
              type: string
              enum: [zh-CN, en-US, vi-VN]
            comment:
              type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        locale:
          type: string
          enum: [zh-CN, en-US, vi-VN]
        rememberMe:
          type: boolean
        deviceLabel:
          type: string
    BootstrapShape:
      type: object
      additionalProperties: true
    DictionaryShape:
      type: object
      properties:
        locale:
          type: string
          enum: [zh-CN, en-US, vi-VN]
        dictionaryVersion:
          type: string
        entries:
          type: object
          additionalProperties:
            type: string
    ReportExportShape:
      type: object
      properties:
        downloadUrl:
          type: string
          format: uri
paths:
  /3d/wms-control-state:
    get:
      tags: [WMS]
      summary: Read the authenticated shared PDA and 3D WMS control state
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current cells, tasks, commands, and floor areas }
        "401": { description: Authentication required }
        "403": { description: wms.view permission required }
  /3d/wms-commands:
    post:
      tags: [WMS]
      summary: Submit an authenticated 3D WMS command
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commandId, action, reason]
              properties:
                commandId: { type: string }
                action: { type: string }
                taskNo: { type: string }
                reason: { type: string }
                scanValue: { type: string, description: Required server-verified pallet or count-location scan for TASK_COMPLETE }
                targetScanValue: { type: string, description: Required server-verified target-location scan for MOVE completion }
                scanEventId: { type: string, description: Required unique scan evidence identifier for TASK_COMPLETE }
      responses:
        "201": { description: Command completed }
        "400": { description: Invalid command or missing scan evidence }
        "401": { description: Authentication required }
        "403": { description: Role or task ownership denied }
        "409": { description: Task state, scan, or inventory conflict }
  /station/database-management:
    get:
      tags: [Admin]
      summary: Consolidated station SQLite and MES synchronization health
      responses:
        "200":
          description: Station database inventory, activity, mismatches, and conflicts
          content:
            application/json:
              schema:
                type: object
                required: [ok, generatedAt, summary, items]
                properties:
                  ok: { type: boolean }
                  generatedAt: { type: string, format: date-time }
                  summary: { type: object }
                  items:
                    type: array
                    items: { type: object }
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a user and issue a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationEnvelope"
        "400":
          description: Invalid login request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/session:
    get:
      tags: [Auth]
      summary: Return the current authenticated session and user contract
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Session missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions for the current user or an admin viewer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelope"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the active session and write an audit event
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Revoke a specific session
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionIdParam"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /meta/bootstrap:
    get:
      tags: [Meta]
      summary: Return session, locale, permissions, visible modules, and UI dictionary versions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LocaleParam"
      responses:
        "200":
          description: Bootstrap payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /meta/i18n/{locale}:
    get:
      tags: [Meta]
      summary: Return the full dictionary bundle for a locale
      security: []
      parameters:
        - $ref: "#/components/parameters/LocalePathParam"
      responses:
        "200":
          description: Dictionary bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /meta/lookups:
    get:
      tags: [Meta]
      summary: Return shared lookup sets such as status codes, locales, and module names
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LocaleParam"
        - $ref: "#/components/parameters/IncludeParam"
      responses:
        "200":
          description: Lookup bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Factory dashboard metrics and live SMT line status
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LocaleParam"
        - $ref: "#/components/parameters/IncludeParam"
      responses:
        "200":
          description: Dashboard state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /erp/master-data:
    get:
      tags: [ERP]
      summary: List shared master records across customers, suppliers, products, materials, BOMs, and delivery plans
      security:
        - bearerAuth: []
      parameters:
        - name: entity
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/QParam"
        - $ref: "#/components/parameters/LocaleParam"
        - name: status
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Master-data list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelope"
    post:
      tags: [ERP]
      summary: Create or update a master-data record using an entity discriminator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          description: Master-data mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationEnvelope"
  /erp/customer-pos:
    get:
      tags: [ERP]
      summary: List customer purchase orders and delivery risk
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QParam"
        - name: customerCode
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/FromDateParam"
        - $ref: "#/components/parameters/ToDateParam"
        - name: status
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: PO list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelope"
    post:
      tags: [ERP]
      summary: Create or confirm a customer purchase order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          description: PO mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationEnvelope"
  /procurement/pos/{id}/incoming-logistics:
    get:
      tags: [Procurement]
      summary: Get PO incoming ASN, pallet logistics, shipment lines, and registered QR hierarchy
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PO incoming logistics detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "404":
          description: Purchase order not found
  /erp/products:
    get:
      tags: [ERP]
      summary: List product master data and active BOM revisions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QParam"
        - $ref: "#/components/parameters/LocaleParam"
        - name: status
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelope"
  /erp/customers:
    get:
      tags: [ERP]
      summary: List customer master records
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QParam"
        - $ref: "#/components/parameters/LocaleParam"
        - name: status
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelope"
  /erp/suppliers:
    get:
      tags: [ERP]
      summary: List supplier master records
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QParam"
        - $ref: "#/components/parameters/LocaleParam"
        - name: status
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Supplier list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelope"
  /erp/materials:
    get:
      tags: [ERP]
      summary: List material master records
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QParam"
        - $ref: "#/components/parameters/LocaleParam"
        - name: status
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Material list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelope"
  /erp/boms:
    get:
      tags: [ERP]
      summary: List BOM headers and revisions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QParam"
        - $ref: "#/components/parameters/LocaleParam"
        - name: status
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: BOM list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelope"
  /erp/boms:
    post:
      tags: [ERP]
      summary: Create BOM with material lines
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          description: BOM created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationEnvelope"
  /erp/boms/{id}:
    get:
      tags: [ERP]
      summary: Get a single BOM with all lines
      security:
        - bearerAuth: []
      responses:
        "200":
          description: BOM detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    patch:
      tags: [ERP]
      summary: Update BOM status (draft / active / obsolete)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          description: BOM updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationEnvelope"
    delete:
      tags: [ERP]
      summary: Delete a BOM and its lines
      security:
        - bearerAuth: []
      responses:
        "200":
          description: BOM deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationEnvelope"
  /erp/boms/product/{code}:
    get:
      tags: [ERP]
      summary: Get latest active BOM for a product code
      security:
        - bearerAuth: []
      responses:
        "200":
          description: BOM for product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /erp/boms/import:
    post:
      tags: [ERP]
      summary: Import BOM from parsed Excel data
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          description: BOM imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationEnvelope"
  /erp/boms/{id}/history:
    get:
      tags: [ERP]
      summary: Get BOM edit history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: BOM history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelope"
    post:
      tags: [ERP]
      summary: Record a BOM edit history entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          description: History entry recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationEnvelope"
  /pmc/closed-loop/dashboard:
    get:
      tags: [PMC]
      summary: Return plan packages with reviews, approvals, bound work orders, and release metrics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: PMC controlled-release dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /pmc/plans/{id}/reviews:
    post:
      tags: [PMC]
      summary: Record or replace one auditable plan-gate review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationEnvelope"
  /pmc/plans/{id}/decision:
    post:
      tags: [PMC]
      summary: Record the PMC Manager or Production Manager plan decision
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          description: Approval decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationEnvelope"
  /pmc/plans/{id}/bind-work-order:
    post:
      tags: [PMC]
      summary: Bind an approved plan to its work order and record WMS kit readiness
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          description: Work order bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationEnvelope"
  /pmc/plans/{id}/release-to-mes:
    post:
      tags: [PMC]
      summary: Release a fully reviewed, approved, bound, and kit-ready plan to MES
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          description: Plan released to MES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationEnvelope"
  /pmc/work-orders:
    get:
      tags: [PMC]
      summary: List work orders with material readiness and execution status
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QParam"
        - name: status
          in: query
          schema:
            type: string
        - name: poNumber
          in: query
          schema:
            type: string
        - name: lineCode
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/FromDateParam"
        - $ref: "#/components/parameters/ToDateParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SortParam"
      responses:
        "200":
          description: Work order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelope"
    post:
      tags: [PMC]
      summary: Create a work order and allocate the next preserved 11 digit code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          description: Work order created
          content:
            application/json:
