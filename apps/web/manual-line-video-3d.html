<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>瑞晶越南工厂｜手动线现场三维还原</title>
    <style>html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:#b9c8d3}*{box-sizing:border-box}</style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        document.getElementById('root').innerHTML = '<pre style="padding:20px;color:#991b1b;background:#fee2e2;white-space:pre-wrap">' + String(event.error && event.error.stack || event.message) + '</pre>';
      });
      window.addEventListener('unhandledrejection', function (event) {
        document.getElementById('root').innerHTML = '<pre style="padding:20px;color:#991b1b;background:#fee2e2;white-space:pre-wrap">' + String(event.reason && event.reason.stack || event.reason) + '</pre>';
      });
    </script>
    <script type="module" src="/src/mes/manual-line-video-3d-entry.tsx?v=20260811-fct-mes-live-2"></script>
  </body>
</html>
