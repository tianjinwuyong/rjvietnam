<svg width="1100" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
      * { font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; }

      .bg { fill: #f0f4f8; }

      /* Company / Factory */
      .co-box { fill: #1a3a5c; stroke: #0d2137; stroke-width: 1.5; filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.25)); }
      .factory-box { fill: #2b6cb0; stroke: #1a4a8a; stroke-width: 1.5; filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.2)); }

      /* Department */
      .dept-box { fill: #3182ce; stroke: #2b5fa8; stroke-width: 1.5; filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.18)); }

      /* Team / role */
      .team-box { fill: #ebf8ff; stroke: #63b3ed; stroke-width: 1.2; filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.12)); }

      /* HQ support — dashed border */
      .support-box { fill: #e6f3ff; stroke: #90cdf4; stroke-width: 1.2; stroke-dasharray: 5 3; filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.1)); }

      /* Lines */
      .solid { stroke: #4a5568; stroke-width: 1.8; }
      .dashed { stroke: #90cdf4; stroke-width: 1.5; stroke-dasharray: 5 3; }

      /* Text */
      .co-text { fill: #ffffff; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .factory-text { fill: #ffffff; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .dept-text { fill: #ffffff; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .team-text { fill: #1a202c; font-size: 10px; font-weight: 500; text-anchor: middle; }
      .sub-text { fill: rgba(255,255,255,0.85); font-size: 9px; text-anchor: middle; }
      .sub-text-dark { fill: #4a5568; font-size: 9px; text-anchor: middle; }
      .label-bg { fill: #2d3748; font-size: 9px; fill: #2b6cb0; fill: #ffffff; font-size: 8px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" class="bg"/>

  <!-- ═══════════════════════════════════════════════════════════
       ROOT — Company
  ═══════════════════════════════════════════════════════════ -->
  <rect x="440" y="20" width="180" height="56" rx="6" class="co-box"/>
  <text x="530" y="43" class="co-text">🏢 公司总负责人</text>
  <text x="530" y="60" class="sub-text" style="fill:rgba(255,255,255,0.8)">深圳：张先生</text>

  <!-- Connector down to factory -->
  <line x1="530" y1="76" x2="530" y2="100" class="solid"/>

  <!-- ═══════════════════════════════════════════════════════════
       FACTORY — 华南工厂
  ═══════════════════════════════════════════════════════════ -->
  <rect x="440" y="100" width="180" height="56" rx="6" class="factory-box"/>
  <text x="530" y="123" class="factory-text">🏭 华南工厂</text>
  <text x="530" y="140" class="sub-text">总负责人：赵明军</text>

  <!-- ═══════════════════════════════════════════════════════════
       FIVE DEPARTMENT BRANCHES
  ═══════════════════════════════════════════════════════════ -->
  <!-- Horizontal connector -->
  <line x1="530" y1="156" x2="530" y2="180" class="solid"/>
  <line x1="120" y1="180" x2="960" y2="180" class="solid"/>
  <!-- Vertical drops -->
  <line x1="120" y1="180" x2="120" y2="205" class="solid"/>
  <line x1="295" y1="180" x2="295" y2="205" class="solid"/>
  <line x1="530" y1="180" x2="530" y2="205" class="solid"/>
  <line x1="765" y1="180" x2="765" y2="205" class="solid"/>
  <line x1="960" y1="180" x2="960" y2="205" class="solid"/>

  <!-- ═══════════════════════════════════════════════════════════
       DEPT 1 — 生产部 (x=60, w=120)
  ═══════════════════════════════════════════════════════════ -->
  <rect x="60" y="205" width="120" height="56" rx="5" class="dept-box"/>
  <text x="120" y="228" class="dept-text">🏭 生产部</text>
  <text x="120" y="246" class="sub-text">负责人：***（精干）</text>

  <!-- Vertical drop + sub-branches -->
  <line x1="120" y1="261" x2="120" y2="285" class="solid"/>
  <line x1="40"  y1="285" x2="80"  y2="285" class="solid"/>
  <line x1="80"  y1="285" x2="80"  y2="305" class="solid"/>
  <line x1="120" y1="285" x2="120" y2="305" class="solid"/>
  <line x1="160" y1="285" x2="160" y2="305" class="solid"/>
  <line x1="200" y1="285" x2="160" y2="285" class="solid"/>

  <rect x="45"  y="305" width="70" height="38" rx="4" class="team-box"/>
  <text x="80" y="319" class="team-text">SMT组长</text>
  <text x="80" y="334" class="sub-text-dark">1人</text>

  <rect x="95"  y="305" width="70" height="38" rx="4" class="team-box"/>
  <text x="130" y="319" class="team-text">自动/线线组长</text>
  <text x="130" y="334" class="sub-text-dark">1人</text>

  <rect x="145" y="305" width="70" height="38" rx="4" class="team-box"/>
  <text x="180" y="319" class="team-text">文员/考勤</text>
  <text x="180" y="334" class="sub-text-dark">1人</text>

  <!-- ═══════════════════════════════════════════════════════════
       DEPT 2 — 工程部 (x=235, w=120)
  ═══════════════════════════════════════════════════════════ -->
  <rect x="235" y="205" width="120" height="56" rx="5" class="dept-box"/>
  <text x="295" y="228" class="dept-text">🔧 工程部</text>
  <text x="295" y="244" class="sub-text" style="font-size:8px">负责人：黎管（中干）</text>
  <text x="295" y="255" class="sub-text" style="font-size:8px">钟玉勤（精干）</text>

  <line x1="295" y1="261" x2="295" y2="285" class="solid"/>
  <!-- 5 sub-branches -->
  <line x1="248" y1="285" x2="248" y2="305" class="solid"/>
  <line x1="268" y1="285" x2="268" y2="305" class="solid"/>
  <line x1="295" y1="285" x2="295" y2="305" class="solid"/>
  <line x1="322" y1="285" x2="322" y2="305" class="solid"/>
  <line x1="342" y1="285" x2="342" y2="305" class="solid"/>
  <line x1="248" y1="285" x2="342" y2="285" class="solid"/>

  <rect x="213" y="305" width="70" height="38" rx="4" class="team-box"/>
  <text x="248" y="319" class="team-text">PE / 维修</text>
  <text x="248" y="334" class="sub-text-dark">1人</text>

  <rect x="233" y="305" width="70" height="38" rx="4" class="team-box"/>
  <text x="268" y="319" class="team-text">SMT技术</text>
  <text x="268" y="334" class="team-text" style="font-size:9px">负责人</text>

  <rect x="260" y="305" width="70" height="38" rx="4" class="team-box"/>
  <text x="295" y="319" class="team-text">TE</text>
  <text x="295" y="334" class="sub-text-dark">1人</text>

  <rect x="287" y="305" width="70" height="38" rx="4" class="team-box"/>
  <text x="322" y="319" class="team-text">ME</text>
  <text x="322" y="334" class="sub-text-dark">2人</text>

  <rect x="314" y="305" width="70" height="38" rx="4" class="team-box"/>
  <text x="349" y="319" class="team-text">系统维护</text>

  <!-- HQ Support (dashed) -->
  <line x1="248" y1="343" x2="248" y2="365" class="dashed"/>
  <line x1="268" y1="343" x2="268" y2="365" class="dashed"/>
  <line x1="295" y1="343" x2="295" y2="365" class="dashed"/>
  <line x1="248" y1="365" x2="295" y2="365" class="dashed"/>

  <rect x="208" y="365" width="70" height="34" rx="4" class="support-box"/>
  <text x="243" y="378" class="sub-text-dark" style="font-size:8px">总部支援</text>
  <text x="243" y="391" class="sub-text-dark">1人</text>

  <rect x="233" y="365" width="70" height="34" rx="4" class="support-box"/>
  <text x="268" y="378" class="sub-text-dark" style="font-size:8px">总部支援</text>
  <text x="268" y="391" class="sub-text-dark">1人</text>

  <rect x="260" y="365" width="70" height="34" rx="4" class="support-box"/>
  <text x="295" y="378" class="sub-text-dark" style="font-size:8px">总部支援</text>
  <text x="295" y="391" class="sub-text-dark">1人</text>

  <!-- ═══════════════════════════════════════════════════════════
       DEPT 3 — 品质部 (x=470, w=120)
  ═══════════════════════════════════════════════════════════ -->
  <rect x="470" y="205" width="120" height="56" rx="5" class="dept-box"/>
  <text x="530" y="228" class="dept-text">✅ 品质部</text>
  <text x="530" y="244" class="sub-text" style="font-size:8px">负责人：***（中干）</text>
  <text x="530" y="255" class="sub-text" style="font-size:8px">***（精干）</text>

  <line x1="530" y1="261" x2="530" y2="285" class="solid"/>
  <line x1="482" y1="285" x2="578" y2="285" class="solid"/>
  <line x1="482" y1="285" x2="482" y2="305" class="solid"/>
  <line x1="506" y1="285" x2="506" y2="305" class="solid"/>
  <line x1="530" y1="285" x2="530" y2="305" class="solid"/>
  <line x1="554" y1="285" x2="554" y2="305" class="solid"/>
  <line x1="578" y1="285" x2="578" y2="305" class="solid"/>

  <rect x="452" y="305" width="60" height="38" rx="4" class="team-box"/>
  <text x="482" y="319" class="team-text">IQC</text>
  <text x="482" y="334" class="sub-text-dark">2人</text>

  <rect x="476" y="305" width="60" height="38" rx="4" class="team-box"/>
  <text x="506" y="319" class="team-text">IPQC</text>
  <text x="506" y="334" class="sub-text-dark">1人</text>

  <rect x="500" y="305" width="60" height="38" rx="4" class="team-box"/>
  <text x="530" y="319" class="team-text">OQC</text>
  <text x="530" y="334" class="sub-text-dark">2人</text>

  <rect x="524" y="305" width="60" height="38" rx="4" class="team-box"/>
  <text x="554" y="319" class="team-text">PQC</text>
  <text x="554" y="334" class="sub-text-dark">1人</text>

  <rect x="548" y="305" width="60" height="38" rx="4" class="team-box"/>
  <text x="578" y="319" class="team-text">体系管理</text>

  <!-- ═══════════════════════════════════════════════════════════
       DEPT 4 — 供应货部 (x=705, w=120)
  ═══════════════════════════════════════════════════════════ -->
  <rect x="705" y="205" width="120" height="56" rx="5" class="dept-box"/>
  <text x="765" y="228" class="dept-text">📦 供应货部</text>
  <text x="765" y="246" class="sub-text">负责人：Tina（越南）</text>

  <line x1="765" y1="261" x2="765" y2="285" class="solid"/>
  <line x1="743" y1="285" x2="787" y2="285" class="solid"/>
  <line x1="743" y1="285" x2="743" y2="305" class="solid"/>
  <line x1="765" y1="285" x2="765" y2="305" class="solid"/>
  <line x1="787" y1="285" x2="787" y2="305" class="solid"/>

  <rect x="713" y="305" width="60" height="38" rx="4" class="team-box"/>
  <text x="743" y="319" class="team-text">PC / MC</text>
  <text x="743" y="334" class="sub-text-dark">1人</text>

  <rect x="735" y="305" width="60" height="38" rx="4" class="team-box"/>
  <text x="765" y="319" class="team-text">材料仓管</text>
  <text x="765" y="334" class="sub-text-dark">1人</text>

  <rect x="757" y="305" width="60" height="38" rx="4" class="team-box"/>
  <text x="787" y="319" class="team-text">成品仓管</text>
  <text x="787" y="334" class="sub-text-dark">1人</text>

  <!-- ═══════════════════════════════════════════════════════════
       DEPT 5 — 财务部 (x=900, w=120)
  ═══════════════════════════════════════════════════════════ -->
  <rect x="900" y="205" width="120" height="56" rx="5" class="dept-box"/>
  <text x="960" y="228" class="dept-text">💰 财务部</text>
  <text x="960" y="246" class="sub-text">负责人：</text>

  <line x1="960" y1="261" x2="960" y2="285" class="solid"/>
  <line x1="940" y1="285" x2="980" y2="285" class="solid"/>
  <line x1="960" y1="285" x2="960" y2="305" class="solid"/>

  <rect x="910" y="305" width="100" height="38" rx="4" class="team-box"/>
  <text x="960" y="319" class="team-text">会计 / 出纳</text>

  <!-- ═══════════════════════════════════════════════════════════
       LEGEND
  ═══════════════════════════════════════════════════════════ -->
  <rect x="30" y="420" width="280" height="90" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
  <text x="44" y="437" style="font-size:10px;font-weight:600;fill:#2d3748">图例 Legend</text>

  <rect x="44" y="444" width="16" height="10" rx="2" class="co-box" style="filter:none"/>
  <text x="66" y="453" style="font-size:9px;fill:#4a5568">公司 / 工厂负责人</text>

  <rect x="44" y="460" width="16" height="10" rx="2" class="dept-box" style="filter:none"/>
  <text x="66" y="469" style="font-size:9px;fill:#4a5568">部门</text>

  <rect x="44" y="476" width="16" height="10" rx="2" class="team-box" style="filter:none"/>
  <text x="66" y="485" style="font-size:9px;fill:#4a5568">岗位 / 人员</text>

  <rect x="44" y="492" width="16" height="10" rx="2" class="support-box" style="filter:none"/>
  <text x="66" y="501" style="font-size:9px;fill:#4a5568">总部虚线支援</text>

  <!-- ═══════════════════════════════════════════════════════════
       STATS BOX
  ═══════════════════════════════════════════════════════════ -->
  <rect x="330" y="420" width="380" height="90" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
  <text x="344" y="437" style="font-size:10px;font-weight:600;fill:#2d3748">人员统计 Summary</text>
  <text x="344" y="454" style="font-size:9px;fill:#4a5568">生产部：3人  |  工程部：5人 + 3人（总部支援）  |</text>
  <text x="344" y="467" style="font-size:9px;fill:#4a5568">品质部：6人  |  供应货部：3人  |  财务部：1人</text>
  <text x="344" y="482" style="font-size:10px;font-weight:600;fill:#2b6cb0">华南工厂合计：约 18人（不含总部支援）</text>

  <!-- Footer -->
  <text x="550" y="700" style="font-size:9px;fill:#a0aec0;text-anchor:middle">越南瑞晶 SMT 工厂 · 组织架构图 · 2025</text>
</svg>
