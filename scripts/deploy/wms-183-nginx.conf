# Install inside the existing 1.13.164.183 nginx server block.
# The reverse SSH tunnel binds only on 183 loopback; WMS is never exposed
# directly from the factory workstation.
location /wms-api/ {
    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-WMS-Gateway 1.13.164.183;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    client_max_body_size 10m;
}
