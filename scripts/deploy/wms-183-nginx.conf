# Install inside the existing 1.13.164.183 nginx server block.
# 183 and the final 122 management system communicate only over Tailscale.
location /wms-api/ {
    proxy_pass http://ruijing-management-122:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-WMS-Gateway 1.13.164.183;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    client_max_body_size 10m;
}
