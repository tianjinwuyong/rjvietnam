name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

# These jobs run the SAME commands as the factory gate's static and unit rungs
# (see harness/harness.config.json). If you change one, change the other -- two
# definitions of "passing" is how a green CI lands on a red gate.
#
# Not run here: harness/END-TO-END.md journeys and .factory/holdout/HOLDOUT.md.
# They are agent-driven against a running stack and belong to `python harness/ci.py`.
# The *-live.test.ts suites are opt-in (RUN_*_LIVE=1 + *_API_BASE) and need a seeded
# database plus a live API; run them with `npm run test:live` on a machine that has one.

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (apps/web + packages)
        run: npm run typecheck

      - name: Parse every service file
        run: npm run check:syntax

      - name: Type check services/api (ratcheted)
        run: npm run typecheck:api

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (database-free)
        run: npm run test:unit -- --reporter=junit --outputFile=vitest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.xml
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The enforcement path is the backend: a plaintext credential anywhere under
      # services/ means the auth route itself trusts a constant, which is what a gate
      # can block automatically.
      #
      # The seeded DEMO login also appears in four UI files (apps/web/src/App.tsx,
      # auth/AuthSignIn.tsx, data.ts, i18n.ts) as prefilled sign-in hints. Scanning
      # those here keeps the job permanently red on a pre-existing condition, and a
      # permanently red check teaches nobody to read the log. It is recorded as a
      # known issue in AGENTS.md; removing it changes what a first-time user sees and
      # is therefore a product decision, not a grep.
      - name: Check for hardcoded credentials in the auth path
        run: |
          set -e
          hits=$(grep -rn "Factory@123" --include="*.js" --include="*.mjs" --include="*.cjs" --include="*.ts" services/ 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "ERROR: hardcoded password in the authentication enforcement path"
            exit 1
          fi
          echo "No hardcoded credentials under services/."

      - name: Check for committed secrets
        run: |
          set -e
          hits=$(grep -rnE "sk-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}" --include="*.js" --include="*.mjs" --include="*.ts" --include="*.tsx" services apps packages 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "ERROR: potential secret found"
            exit 1
          fi
          echo "No committed secrets."
